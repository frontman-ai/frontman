<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACP + MCP Client Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background: #1a1a2e;
      color: #eee;
    }
    h1 { color: #00d4ff; }
    .config {
      background: #16213e;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    label { display: block; margin-bottom: 5px; color: #888; }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #333;
      border-radius: 4px;
      background: #0f3460;
      color: #fff;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 10px;
      margin-bottom: 10px;
    }
    .btn-connect { background: #00d4ff; color: #000; }
    .btn-connect:hover { background: #00a8cc; }
    .btn-session { background: #9b59b6; color: #fff; }
    .btn-session:hover { background: #8e44ad; }
    .btn-disconnect { background: #e94560; color: #fff; }
    .btn-disconnect:hover { background: #c73e54; }
    button:disabled { background: #666; cursor: not-allowed; }
    .status {
      padding: 10px 15px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-weight: bold;
    }
    .status.disconnected { background: #333; color: #888; }
    .status.connecting { background: #f39c12; color: #000; }
    .status.connected { background: #27ae60; color: #fff; }
    .status.error { background: #e74c3c; color: #fff; }
    .log-container {
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 4px;
      height: 400px;
      overflow-y: auto;
      padding: 10px;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 12px;
    }
    .log-entry { margin-bottom: 5px; }
    .log-entry.info { color: #00d4ff; }
    .log-entry.success { color: #27ae60; }
    .log-entry.error { color: #e74c3c; }
    .log-entry.warn { color: #f39c12; }
    .log-entry .time { color: #666; margin-right: 10px; }
    .server-info {
      background: #16213e;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .server-info h3 { margin-top: 0; color: #00d4ff; }
    .server-info pre {
      background: #0a0a0a;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
      margin: 0;
    }
    .session-info {
      background: #1e3a5f;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .session-info h3 { margin-top: 0; color: #9b59b6; }
    .session-id { font-family: monospace; font-size: 16px; color: #fff; }
    .chat-container {
      background: #16213e;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .chat-container h3 { margin-top: 0; color: #00d4ff; }
    .messages {
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 4px;
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 10px;
    }
    .message {
      margin-bottom: 10px;
      padding: 8px 12px;
      border-radius: 4px;
    }
    .message.user {
      background: #0f3460;
      margin-left: 20%;
    }
    .message.assistant {
      background: #1e3a5f;
      margin-right: 20%;
    }
    .message .role {
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
    }
    .chat-input {
      display: flex;
      gap: 10px;
    }
    .chat-input input {
      flex: 1;
      margin-bottom: 0;
    }
    .btn-send {
      background: #27ae60;
      color: #fff;
    }
    .btn-send:hover { background: #219a52; }
    .mcp-info {
      background: #2d1f3d;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .mcp-info h3 { margin-top: 0; color: #e056fd; }
    .mcp-status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 4px;
      font-weight: bold;
      margin-left: 10px;
    }
    .mcp-status.pending { background: #666; color: #fff; }
    .mcp-status.ready { background: #27ae60; color: #fff; }
    .log-entry.mcp { color: #e056fd; }
  </style>
</head>
<body>
  <h1>ACP + MCP Client Test</h1>

  <div class="config">
    <label for="endpoint">WebSocket Endpoint</label>
    <input type="text" id="endpoint" value="ws://localhost:4000/socket" />

    <button class="btn-connect" id="connectBtn">Connect & Initialize</button>
    <button class="btn-session" id="createSessionBtn" disabled>Create Session</button>
    <button class="btn-disconnect" id="disconnectBtn" disabled>Disconnect</button>
  </div>

  <div class="status disconnected" id="status">Disconnected</div>

  <div class="server-info" id="serverInfo" style="display: none;">
    <h3>Server Info</h3>
    <pre id="serverInfoContent"></pre>
  </div>

  <div class="session-info" id="sessionInfo" style="display: none;">
    <h3>Session Created</h3>
    <div>Session ID: <span class="session-id" id="sessionIdDisplay"></span></div>
  </div>

  <div class="mcp-info" id="mcpInfo" style="display: none;">
    <h3>MCP Server <span class="mcp-status pending" id="mcpStatus">Pending</span></h3>
    <div>Browser acting as MCP server for agent tools</div>
  </div>

  <div class="chat-container" id="chatContainer" style="display: none;">
    <h3>Chat</h3>
    <div class="messages" id="messages"></div>
    <div class="chat-input">
      <input type="text" id="messageInput" placeholder="Type a message..." />
      <button class="btn-send" id="sendBtn">Send</button>
    </div>
  </div>

  <h2>Log</h2>
  <div class="log-container" id="log"></div>

  <script type="module">
    import * as ACP from '../src/FrontmanClient__ACP.res.mjs';
    import * as MCP from '../src/FrontmanClient__MCP.res.mjs';
    import * as MCPServer from '../src/FrontmanClient__MCP__Server.res.mjs';
    import * as ConsoleLogTool from '../src/FrontmanClient__MCP__Tool__ConsoleLog.res.mjs';

    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    const connectBtn = document.getElementById('connectBtn');
    const createSessionBtn = document.getElementById('createSessionBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const serverInfoEl = document.getElementById('serverInfo');
    const serverInfoContentEl = document.getElementById('serverInfoContent');
    const sessionInfoEl = document.getElementById('sessionInfo');
    const sessionIdDisplayEl = document.getElementById('sessionIdDisplay');
    const mcpInfoEl = document.getElementById('mcpInfo');
    const mcpStatusEl = document.getElementById('mcpStatus');
    const chatContainer = document.getElementById('chatContainer');
    const messagesEl = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    let connection = null;
    let session = null;
    let mcpHandler = null;
    let currentAssistantMessage = null;

    // Create MCP server instance and register tools
    let mcpServer = MCPServer.make("browser-test-mcp", "1.0.0");
    mcpServer = MCPServer.registerToolModule(mcpServer, ConsoleLogTool);

    function log(message, type = 'info') {
      const time = new Date().toLocaleTimeString();
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.innerHTML = `<span class="time">${time}</span>${message}`;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(status, text) {
      statusEl.className = `status ${status}`;
      statusEl.textContent = text;
    }

    function updateButtons(connected) {
      connectBtn.disabled = connected;
      createSessionBtn.disabled = !connected;
      disconnectBtn.disabled = !connected;
    }

    function logMessage(direction, payload) {
      const isSend = direction === 'Send';
      const arrow = isSend ? '→' : '←';
      const color = isSend ? 'warn' : 'success';
      const label = isSend ? 'SEND' : 'RECV';
      log(`${arrow} <b>ACP ${label}</b> ${JSON.stringify(payload, null, 2)}`, color);
    }

    function logMcpMessage(direction, payload) {
      // ReScript v12 compiles simple variants to strings, not {TAG: ...} objects
      const isSend = direction === 'Send';
      const arrow = isSend ? '→' : '←';
      const label = isSend ? 'SEND' : 'RECV';
      log(`${arrow} <b>MCP ${label}</b> ${JSON.stringify(payload, null, 2)}`, 'mcp');

      // Update MCP status when we send initialize response
      if (isSend && payload.result && payload.result.protocolVersion) {
        mcpStatusEl.textContent = 'Ready';
        mcpStatusEl.className = 'mcp-status ready';
        log('MCP initialization complete!', 'success');
      }
    }

    async function connect() {
      const endpoint = document.getElementById('endpoint').value;

      log(`Connecting to ${endpoint}...`);
      setStatus('connecting', 'Connecting...');

      try {
        const config = ACP.makeConfig(endpoint, 'browser-test-client', '1.0.0', logMessage);
        log(`Config created`);

        const result = await ACP.connect(config);

        if (result.TAG === 'Ok') {
          connection = result._0;
          log('Connected and initialized!', 'success');
          setStatus('connected', 'Connected & Initialized');
          updateButtons(true);

          // Show server info
          const state = ACP.getState(connection);
          if (state.TAG === 'Initialized') {
            const initResult = state._0;
            serverInfoContentEl.textContent = JSON.stringify(initResult, null, 2);
            serverInfoEl.style.display = 'block';
            log(`Server: ${initResult.agentInfo?.name || 'Unknown'} v${initResult.agentInfo?.version || '?'}`, 'success');
            log(`Protocol version: ${initResult.protocolVersion}`, 'info');
          }
        } else {
          const error = result._0;
          log(`Connection failed: ${error}`, 'error');
          setStatus('error', `Error: ${error}`);
          updateButtons(false);
        }
      } catch (err) {
        log(`Exception: ${err.message}`, 'error');
        setStatus('error', `Error: ${err.message}`);
        updateButtons(false);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function appendUserMessage(text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message user';
      msgDiv.innerHTML = `<div class="role">You</div><div class="text">${escapeHtml(text)}</div>`;
      messagesEl.appendChild(msgDiv);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function appendAssistantChunk(text) {
      if (!currentAssistantMessage) {
        currentAssistantMessage = document.createElement('div');
        currentAssistantMessage.className = 'message assistant';
        currentAssistantMessage.innerHTML = `<div class="role">Assistant</div><div class="text"></div>`;
        messagesEl.appendChild(currentAssistantMessage);
      }
      const textEl = currentAssistantMessage.querySelector('.text');
      textEl.textContent += text;
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function handleSessionUpdate(update) {
      if (update.sessionUpdate === 'agent_message_chunk') {
        const content = update.content;
        if (content.text) {
          appendAssistantChunk(content.text);
        }
      }
    }

    async function createSession() {
      if (!connection) {
        log('Not connected', 'error');
        return;
      }

      log('Creating new session...', 'info');
      console.log('[DEBUG] Before createSession call');

      try {
        // DEBUG: Listen for mcp:message at socket level to see if it arrives before we attach
        let earlyMcpMessage = null;
        const debugChannel = connection.socket.channel(`debug_mcp_check`);

        const result = await ACP.createSession(connection, handleSessionUpdate);
        console.log('[DEBUG] After createSession returned');

        if (result.TAG === 'Ok') {
          session = result._0;
          const sessionId = session.sessionId;
          log(`Session created and joined: ${sessionId}`, 'success');
          console.log('[DEBUG] Session joined, about to attach MCP handler');

          sessionIdDisplayEl.textContent = sessionId;
          sessionInfoEl.style.display = 'block';
          mcpInfoEl.style.display = 'block';
          chatContainer.style.display = 'block';

          // Attach MCP handler to session channel
          log('Attaching MCP handler to session channel...', 'info');
          mcpHandler = MCP.attach(session.channel, mcpServer, logMcpMessage);
          console.log('[DEBUG] MCP handler attached');
          log('MCP handler attached, waiting for agent initialize request...', 'info');
        } else {
          const error = result._0;
          log(`Failed to create session: ${error}`, 'error');
        }
      } catch (err) {
        log(`Exception creating session: ${err.message}`, 'error');
        console.error('[DEBUG] Exception:', err);
      }
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || !session) return;

      messageInput.value = '';
      appendUserMessage(text);
      currentAssistantMessage = null;

      log(`Sending prompt: "${text}"`, 'info');

      try {
        const result = await ACP.sendPrompt(session, text);
        if (result.TAG === 'Ok') {
          log(`Prompt completed: ${result._0.stopReason}`, 'success');
        } else {
          log(`Prompt failed: ${result._0}`, 'error');
        }
      } catch (err) {
        log(`Exception sending prompt: ${err.message}`, 'error');
      }
    }

    function disconnect() {
      if (connection) {
        log('Disconnecting...', 'warn');
        if (mcpHandler) {
          MCP.detach(mcpHandler);
          mcpHandler = null;
        }
        connection = null;
        session = null;
        setStatus('disconnected', 'Disconnected');
        updateButtons(false);
        serverInfoEl.style.display = 'none';
        sessionInfoEl.style.display = 'none';
        mcpInfoEl.style.display = 'none';
        mcpStatusEl.textContent = 'Pending';
        mcpStatusEl.className = 'mcp-status pending';
        chatContainer.style.display = 'none';
        messagesEl.innerHTML = '';
        log('Disconnected', 'info');
      }
    }

    connectBtn.addEventListener('click', connect);
    createSessionBtn.addEventListener('click', createSession);
    disconnectBtn.addEventListener('click', disconnect);
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    log('ACP + MCP Client Test Page loaded', 'success');
    log('Click "Connect & Initialize" to start');
    log('After creating a session, MCP handler will respond to agent initialize requests', 'info');
  </script>
</body>
</html>
