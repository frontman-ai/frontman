approvedGitRepositories:
  - "https://github.com/frontman-ai/dom-element-to-component-source.git"
  - "https://github.com/frontman-ai/reworker.git"

catalog:
  "@rescript/runtime": 12.3.0
  "@rescript/webapi": "*"
  "@vitest/coverage-v8": 4.1.10
  dotenv: 17.2.3
  rescript: 12.3.0
  rescript-vitest: "https://github.com/cometkim/rescript-vitest/archive/662019a08334dd1b188efe6b0b306c9c0bcdb75a.tar.gz"
  sury: 11.0.0-alpha.11
  sury-ppx: 11.0.0-alpha.10
  vite: ^8.1.5
  vitest: 4.1.10

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

packageExtensions:
  "@astrojs/compiler-binding-wasm32-wasi@0.3.2":
    dependencies:
      "@emnapi/core": ^1.7.1
      "@emnapi/runtime": ^1.7.1
  "@astrojs/language-server@*":
    dependencies:
      typescript: "*"
  "@astrojs/preact@*":
    dependencies:
      "@babel/core": ^7.0.0
  "@preact/preset-vite@*":
    dependencies:
      preact: "*"
  "@sentry/nextjs@*":
    dependencies:
      "@opentelemetry/core": ^2.6.1
      "@opentelemetry/sdk-trace-base": ^2.6.1
    peerDependencies:
      react: ^16.14.0 || 17.x || 18.x || 19.x
  "@sentry/node@10.66.0":
    dependencies:
      "@opentelemetry/core": ^2.6.1
  "@sentry/webpack-plugin@*":
    peerDependenciesMeta:
      webpack:
        optional: true
  "@tiptap/react@3.30.1":
    dependencies:
      "@floating-ui/dom": ^1.8.0
