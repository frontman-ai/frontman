name: Release Tag

on:
  push:
    branches:
      - main
    paths:
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  create-release:
    name: Tag & GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify this is a release commit
        id: verify
        run: |
          COMMIT_MSG=$(git log -1 --format='%s')
          if echo "$COMMIT_MSG" | grep -qE '^chore: release v[0-9]'; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          elif echo "$COMMIT_MSG" | grep -qE '^Merge pull request.*release/v[0-9]'; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping — not a release commit: $COMMIT_MSG"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract version and changelog
        if: steps.verify.outputs.is_release == 'true'
        id: extract
        run: |
          VERSION=$(sed -n 's/^## \[\{0,1\}\([0-9][0-9.]*\).*/\1/p' CHANGELOG.md | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract version from CHANGELOG.md"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

          awk '/^## [0-9[]/{if(found) exit; found=1; next} found' CHANGELOG.md > /tmp/release-notes.md
          echo "Extracted release notes for v${VERSION}"

      - name: Check if tag already exists
        if: steps.verify.outputs.is_release == 'true'
        id: tag-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.extract.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            [ "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)" ] || {
              echo "::error::Tag $TAG points to a different commit"
              exit 1
            }
            RELEASES=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate)
            DRAFT=$(echo "$RELEASES" | jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .draft')
            if [ "$DRAFT" = false ]; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "Release $TAG is already published — skipping"
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.verify.outputs.is_release == 'true' && steps.tag-check.outputs.exists == 'false'
        with:
          node-version: '24.4.1'

      - name: Install bridge build dependencies
        if: steps.verify.outputs.is_release == 'true' && steps.tag-check.outputs.exists == 'false'
        run: corepack enable && corepack install && yarn install --immutable

      - name: Package WordPress release assets
        if: steps.verify.outputs.is_release == 'true' && steps.tag-check.outputs.exists == 'false'
        run: make package-wordpress-plugin VERSION="${{ steps.extract.outputs.version }}"

      - name: Package changed OpenAI candidate
        if: steps.verify.outputs.is_release == 'true' && steps.tag-check.outputs.exists == 'false'
        id: openai
        env:
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          NEEDED=$(bash scripts/openai-wordpress-release-needed.sh)
          if [ "$NEEDED" = true ]; then
            make -C plugins/openai-wordpress sync-release NODE=node VERSION="$VERSION"
            make -C plugins/openai-wordpress check test NODE=node
            make package-openai-wordpress NODE=node VERSION="$VERSION"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and GitHub Release
        if: steps.verify.outputs.is_release == 'true' && steps.tag-check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_NEEDED: ${{ steps.openai.outputs.needed }}
        run: |
          TAG="${{ steps.extract.outputs.tag }}"
          VERSION="${{ steps.extract.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            GIT_EDITOR=true git tag -a "$TAG" -m "Release ${VERSION}"
            git push origin "$TAG"
          fi

          ASSETS=("dist/frontman-wordpress-v${VERSION}.zip" "dist/frontman-wordpress-org-v${VERSION}.tar.gz")
          if [ "$OPENAI_NEEDED" = true ]; then
            ASSETS+=("plugins/openai-wordpress/frontman-openai-wordpress-v${VERSION}.zip")
          fi
          RELEASES=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate)
          DRAFT=$(echo "$RELEASES" | jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .draft')
          if [ "$DRAFT" = true ]; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          elif [ -z "$DRAFT" ]; then
            gh release create "$TAG" \
              --draft \
              --verify-tag \
              --title "v${VERSION}" \
              --notes-file /tmp/release-notes.md \
              "${ASSETS[@]}"
          else
            echo "::error::Release $TAG is already published"
            exit 1
          fi
          gh release edit "$TAG" --draft=false
          if [ "$OPENAI_NEEDED" = true ]; then
            {
              echo "OpenAI candidate: frontman-openai-wordpress-v${VERSION}.zip"
              echo "OpenAI upload, review submission, and publication remain manual."
              echo "[Manual release instructions](https://github.com/${GITHUB_REPOSITORY}/blob/$(git rev-parse HEAD)/plugins/openai-wordpress/README.md#manual-openai-release)"
            } >> "$GITHUB_STEP_SUMMARY"
