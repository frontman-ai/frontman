name: Release Tag

on:
  push:
    branches:
      - main
    paths:
      - 'CHANGELOG.md'

jobs:
  create-release:
    name: Tag & GitHub Release
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version and changelog
        id: extract
        run: |
          VERSION=$(grep -oP '(?<=## \[)[^\]]+' CHANGELOG.md | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

          # Extract changelog section between the first and second ## [...] headings
          awk '/^## \[/{if(found) exit; found=1; next} found' CHANGELOG.md > /tmp/release-notes.md
          echo "Extracted release notes for v${VERSION}"

      - name: Check if tag already exists
        id: tag-check
        run: |
          TAG="${{ steps.extract.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists — skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and GitHub Release
        if: steps.tag-check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.extract.outputs.tag }}"
          VERSION="${{ steps.extract.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Release ${VERSION}"
          git push origin "$TAG"

          gh release create "$TAG" \
            --title "v${VERSION}" \
            --notes-file /tmp/release-notes.md
