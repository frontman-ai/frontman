name: Release PR

on:
  workflow_dispatch:

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  create-release-pr:
    name: Create Release PR
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.4.1'

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check for pending changesets
        run: |
          COUNT=$(find .changeset -name '*.md' ! -name 'README.md' | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No pending changesets found. Nothing to release."
            exit 1
          fi
          echo "Found $COUNT pending changeset(s)"

      - name: Run changeset version
        run: yarn changeset version

      - name: Extract version from CHANGELOG
        id: version
        run: |
          # Match both "## [0.4.0]" (Keep a Changelog) and "## 0.4.0" (changesets) formats
          VERSION=$(sed -n 's/^## \[\{0,1\}\([0-9][0-9.]*\).*/\1/p' CHANGELOG.md | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract version from CHANGELOG.md"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Create release branch and PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="release/v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: release v${VERSION}"
          git push --force-with-lease -u origin "$BRANCH"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || true)

          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "PR #${EXISTING_PR} already exists for $BRANCH — updated with latest push"
          else
            gh pr create \
              --title "chore: release v${VERSION}" \
              --body "## Release v${VERSION}

          This PR was created by \`make release\`. It contains:
          - Version bumps for affected packages
          - Updated CHANGELOG.md

          **Review the changelog below, then merge when ready to release.**

          Once merged, a git tag \`v${VERSION}\` and GitHub Release will be created automatically, and the marketing site will redeploy with the updated changelog." \
              --label "skip-changelog"
          fi
