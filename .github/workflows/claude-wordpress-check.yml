name: Claude WordPress Check

on:
  pull_request:
    paths:
      - 'plugins/claude-wordpress/**'
      - 'scripts/install-claude-wordpress-validator.sh'
      - '.github/workflows/claude-wordpress-check.yml'
      - 'Makefile'
  push:
    paths:
      - 'plugins/claude-wordpress/**'
      - 'scripts/install-claude-wordpress-validator.sh'
      - '.github/workflows/claude-wordpress-check.yml'
      - 'Makefile'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Claude validator
        run: make -C plugins/claude-wordpress toolchain
      - name: Check endpoint and plugin package
        run: make -C plugins/claude-wordpress test
