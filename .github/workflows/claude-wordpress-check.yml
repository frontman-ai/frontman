name: Claude WordPress Check

on:
  pull_request:
    paths:
      - 'plugins/claude-wordpress/**'
      - 'scripts/*claude-wordpress*.sh'
      - '.github/workflows/claude-wordpress-check.yml'
      - 'Makefile'
  push:
    paths:
      - 'plugins/claude-wordpress/**'
      - 'scripts/*claude-wordpress*.sh'
      - '.github/workflows/claude-wordpress-check.yml'
      - 'Makefile'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install pinned Claude validator
        run: make -C plugins/claude-wordpress toolchain
      - name: Check, test, and package
        run: make -C plugins/claude-wordpress check test package
      - name: Enforce source version increase
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/check-claude-wordpress-version.sh "$BASE_SHA" HEAD
