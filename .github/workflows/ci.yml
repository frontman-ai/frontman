name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.4.1'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable --immutable

      - name: Clean ReScript build cache
        run: yarn rescript clean

      - name: Build project
        run: make build

  test-frontman-client:
    name: Test frontman-client
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.4.1'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests with coverage
        run: make -C libs/frontman-client test-coverage

      - name: Coverage report
        uses: 5monkeys/cobertura-action@master
        with:
          path: libs/frontman-client/coverage/cobertura-coverage.xml
          minimum_coverage: 70
          show_missing: true
          skip_covered: false
          only_changed_files: false

  test-frontman-core:
    name: Test frontman-core
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.4.1'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests with coverage
        run: make -C libs/frontman-core test-coverage

      - name: Coverage report
        uses: 5monkeys/cobertura-action@master
        with:
          path: libs/frontman-core/coverage/cobertura-coverage.xml
          minimum_coverage: 70
          show_missing: true
          skip_covered: false
          only_changed_files: false

  test-frontman-nextjs:
    name: Test frontman-nextjs
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.4.1'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests with coverage
        run: make -C libs/frontman-nextjs test-coverage

      - name: Coverage report
        uses: 5monkeys/cobertura-action@master
        with:
          path: libs/frontman-nextjs/coverage/cobertura-coverage.xml
          minimum_coverage: 70
          show_missing: true
          skip_covered: false
          only_changed_files: false

  lint-frontman-server:
    name: Lint frontman-server
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Uses mise.toml as single source of truth for Erlang/Elixir versions
      - name: Setup Erlang/Elixir via mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: apps/frontman_server/deps
          key: ${{ runner.os }}-mix-${{ hashFiles('apps/frontman_server/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Cache _build
        uses: actions/cache@v4
        with:
          path: apps/frontman_server/_build
          key: ${{ runner.os }}-build-${{ hashFiles('apps/frontman_server/mix.lock') }}
          restore-keys: ${{ runner.os }}-build-

      - name: Install dependencies
        run: make -C apps/frontman_server install

      - name: Run lint
        run: make -C apps/frontman_server lint

  test-frontman-server:
    name: Test frontman-server
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
      checks: write
    env:
      DB_HOST: host.docker.internal
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Uses mise.toml as single source of truth for Erlang/Elixir versions
      - name: Setup Erlang/Elixir via mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: apps/frontman_server/deps
          key: ${{ runner.os }}-mix-${{ hashFiles('apps/frontman_server/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Cache _build
        uses: actions/cache@v4
        with:
          path: apps/frontman_server/_build
          key: ${{ runner.os }}-build-${{ hashFiles('apps/frontman_server/mix.lock') }}
          restore-keys: ${{ runner.os }}-build-

      - name: Install dependencies
        run: make -C apps/frontman_server install

      - name: Run tests with coverage
        run: make -C apps/frontman_server test-coverage
        env:
          CLOAK_KEY: "dGVzdC1rZXktZm9yLWNpLXRoaXMtaXMtMzJieXRlc3M="

      - name: Coverage details
        run: cd apps/frontman_server && MIX_ENV=test mix coveralls.detail

      - name: Coverage report
        uses: 5monkeys/cobertura-action@master
        with:
          path: apps/frontman_server/cover/cobertura.xml
          minimum_coverage: 75
          show_missing: true
          skip_covered: false
          only_changed_files: false

  dialyzer-frontman-server:
    name: Dialyzer frontman-server
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Uses mise.toml as single source of truth for Erlang/Elixir versions
      - name: Setup Erlang/Elixir via mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: apps/frontman_server/deps
          key: ${{ runner.os }}-mix-${{ hashFiles('apps/frontman_server/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Cache _build
        uses: actions/cache@v4
        with:
          path: apps/frontman_server/_build
          key: ${{ runner.os }}-build-${{ hashFiles('apps/frontman_server/mix.lock') }}
          restore-keys: ${{ runner.os }}-build-

      # PLT cache includes mise.toml hash to invalidate when Erlang/Elixir versions change
      # v3: bust cache after migrating to self-hosted runners (different mise install path)
      - name: Cache PLT
        uses: actions/cache@v4
        with:
          path: apps/frontman_server/priv/plts
          key: ${{ runner.os }}-plt-v3-${{ hashFiles('mise.toml', 'apps/frontman_server/mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-v3-

      - name: Install dependencies
        run: make -C apps/frontman_server install

      - name: Run Dialyzer
        run: make -C apps/frontman_server dialyzer

  test-react-statestore:
    name: Test react-statestore
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.4.1'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests with coverage
        run: make -C libs/react-statestore test-coverage

      - name: Coverage report
        uses: 5monkeys/cobertura-action@master
        with:
          path: libs/react-statestore/coverage/cobertura-coverage.xml
          minimum_coverage: 70
          show_missing: true
          skip_covered: false
          only_changed_files: false

  test-client:
    name: Test client
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.4.1'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests with coverage
        run: make -C libs/client test-coverage

      - name: Coverage report
        uses: 5monkeys/cobertura-action@master
        with:
          path: libs/client/coverage/cobertura-coverage.xml
          minimum_coverage: 70
          show_missing: true
          skip_covered: false
          only_changed_files: false

  test-context-loader:
    name: Test context-loader
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.4.1'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests with coverage
        run: make -C libs/context-loader test-coverage

      - name: Coverage report
        uses: 5monkeys/cobertura-action@master
        with:
          path: libs/context-loader/coverage/cobertura-coverage.xml
          minimum_coverage: 70
          show_missing: true
          skip_covered: false
          only_changed_files: false

  lint-client:
    name: Lint libs/client
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes in libs/client
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            client:
              - 'libs/client/**'

      - name: Enable Corepack
        if: steps.changes.outputs.client == 'true'
        run: corepack enable

      - name: Setup Node.js
        if: steps.changes.outputs.client == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24.4.1'
          cache: 'yarn'

      - name: Install dependencies
        if: steps.changes.outputs.client == 'true'
        run: yarn install --immutable

      - name: Run biome lint
        if: steps.changes.outputs.client == 'true'
        run: cd libs/client && npx biome lint .
