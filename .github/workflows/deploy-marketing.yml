name: Deploy Marketing

on:
  push:
    branches:
      - main
    paths:
      - 'apps/marketing/**'
      - 'libs/frontman-astro/**'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy to Production
    runs-on: self-hosted
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.4.1'

      - name: Enable Corepack
        run: corepack enable && corepack install

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry/cache
          key: yarn-berry-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-berry-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build ReScript packages
        run: yarn rescript

      - name: Bundle astro integration
        run: yarn build:bundle
        working-directory: libs/frontman-astro

      - name: Build marketing site
        run: cd apps/marketing && yarn build

      - name: Deploy to Cloudflare Pages (Production)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: yarn
          workingDirectory: apps/marketing
          command: pages deploy dist --project-name=frontman-marketing --branch=main

      - name: Submit to IndexNow
        if: success()
        continue-on-error: true
        run: node apps/marketing/scripts/indexnow.mjs

      - name: Notify Discord
        if: always()
        continue-on-error: true
        uses: ./.github/actions/discord-notify
        with:
          status: ${{ job.status }}
          component: Marketing
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
