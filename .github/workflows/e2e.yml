name: E2E Tests

on:
  pull_request:
    paths:
      - "test/e2e/**"
      - "test/mcp-conformance/**"
      - "test/astro-compat/**"
      - "libs/bindings/**"
      - "libs/client/**"
      - "libs/frontman-client/**"
      - "libs/frontman-protocol/**"
      - "libs/frontman-core/**"
      - "libs/frontman-nextjs/**"
      - "libs/frontman-astro/**"
      - "libs/frontman-astro-browser/**"
      - "libs/frontman-vite/**"
      - "libs/frontman-wordpress/**"
      - "scripts/package-wordpress-plugin.sh"
      - "scripts/validate-wordpress-plugin-release.sh"
      - "docs/mcp/**"
      - "plaan.md"
      - ".changeset/**"
      - "Makefile"
      - "yarn.lock"
      - "apps/frontman_server/lib/**"
      - "apps/frontman_server/config/**"
      - "apps/frontman_server/assets/js/browser-test.js"
      - "apps/frontman_server/priv/**"
      - "apps/frontman_server/mix.*"
      - "apps/swarm_ai/**"
      - "mise.toml"
      - "package.json"
      - "rescript.json"
      - ".yarnrc.yml"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Which test suite to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - nextjs
          - astro
          - vite
          - vue-vite

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (${{ github.event.inputs.test_suite || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: e2e
      PHX_SERVER: "true"
      DB_NAME: frontman_server_e2e_${{ github.run_id }}
      CLOAK_KEY: "HE9hCRnQXEREL1X+1+cU4wPdVGqJMhwR05edbBBq1RY="
      YARN_ENABLE_HARDENED_MODE: "0"
      E2E_OPENAI_ACCESS_TOKEN: ${{ secrets.E2E_CHATGPT_ACCESS_TOKEN }}
      E2E_OPENAI_REFRESH_TOKEN: ${{ secrets.E2E_CHATGPT_REFRESH_TOKEN }}
      E2E_OPENAI_ACCOUNT_ID: ${{ secrets.E2E_CHATGPT_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          clean: false

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y -qq libssl-dev libncurses5-dev libnss3-tools postgresql-client > /dev/null

      - name: Fix mise binary permissions
        run: chmod -R +x ~/.local/share/mise/bin/ 2>/dev/null || true

      - name: Setup Erlang/Elixir via mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          install: true
          cache: true

      - name: Install Hex/Rebar
        run: make setup-elixir-tools

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24.4.1"

      - name: Enable Corepack
        run: corepack enable && corepack install

      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-

      - name: Cache Mix deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/frontman_server/deps
          key: ${{ runner.os }}-mix-${{ hashFiles('apps/frontman_server/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Cache Mix _build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/frontman_server/_build
          key: ${{ runner.os }}-build-e2e-${{ hashFiles('apps/frontman_server/mix.lock', 'apps/swarm_ai/lib/**') }}
          restore-keys: ${{ runner.os }}-build-e2e-

      - name: Install Node.js dependencies
        run: yarn install --immutable

      - name: Install Elixir dependencies
        working-directory: apps/frontman_server
        run: |
          mix deps.clean --unlock --unused
          mix deps.get

      - name: Clean stale test databases
        run: bash scripts/ci/postgres-test-db-cleanup.sh stale

      - name: Compile e2e with warnings as errors
        working-directory: apps/frontman_server
        run: mix compile --warnings-as-errors --all-warnings

      - name: Cache JS build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: js-build-cache
        with:
          path: libs/*/dist
          key: js-build-v2-${{ runner.os }}-${{ hashFiles('libs/*/src/**', 'libs/*/rescript.json', 'libs/*/tsup.config.ts') }}
          restore-keys: js-build-v2-${{ runner.os }}-

      - name: Build ReScript
        run: yarn rescript

      - name: Build adapter dist packages
        if: steps.js-build-cache.outputs.cache-hit != 'true'
        run: |
          yarn workspace @frontman-ai/nextjs build
          yarn workspace @frontman-ai/vite build
          yarn workspace @frontman-ai/astro build

      - name: Generate mkcert certificates
        run: |
          mkcert -install 2>/dev/null || true
          mkdir -p .certs
          mkcert -key-file .certs/frontman.local-key.pem \
                 -cert-file .certs/frontman.local.pem \
                 frontman.local localhost 127.0.0.1 ::1

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('test/e2e/package.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps 2>&1 | tail -5
        working-directory: test/e2e

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium 2>&1 | tail -5
        working-directory: test/e2e

      - name: Determine test command
        id: test-cmd
        run: |
          SUITE="${{ github.event.inputs.test_suite }}"
          if [ "$SUITE" = "all" ] || [ -z "$SUITE" ]; then
            echo "cmd=npx vitest run" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=npx vitest run tests/${SUITE}.test.ts" >> "$GITHUB_OUTPUT"
          fi

      - name: Run E2E tests
        working-directory: test/e2e
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: ${{ steps.test-cmd.outputs.cmd }}

      - name: Cleanup workspace
        if: always()
        run: |
          lsof -ti:4002 2>/dev/null | xargs kill -9 2>/dev/null || true
          lsof -ti:5173 2>/dev/null | xargs kill -9 2>/dev/null || true
          lsof -ti:3010 2>/dev/null | xargs kill -9 2>/dev/null || true
          lsof -ti:3011 2>/dev/null | xargs kill -9 2>/dev/null || true
          lsof -ti:3012 2>/dev/null | xargs kill -9 2>/dev/null || true
          lsof -ti:3013 2>/dev/null | xargs kill -9 2>/dev/null || true
          bash scripts/ci/postgres-test-db-cleanup.sh current-e2e || true
          bash scripts/ci/postgres-test-db-cleanup.sh stale || true
          git checkout -- test/e2e/fixtures/ 2>/dev/null || true
          git clean -fd -- test/e2e/fixtures/ 2>/dev/null || true

  mcp-blackbox:
    name: MCP Adapter Black Box
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24.4.1"
      - name: Enable Corepack
        run: corepack enable && corepack install
      - name: Install dependencies
        run: yarn install --immutable
      - name: Run real-process MCP adapter suite
        run: make mcp-blackbox
      - name: Run pinned official MCP conformance suite
        run: make mcp-conformance
      - name: Cleanup fixture processes
        if: always()
        run: |
          lsof -ti:3110 2>/dev/null | xargs kill -9 2>/dev/null || true
          lsof -ti:3111 2>/dev/null | xargs kill -9 2>/dev/null || true
          lsof -ti:3112 2>/dev/null | xargs kill -9 2>/dev/null || true
          lsof -ti:9410 2>/dev/null | xargs kill -9 2>/dev/null || true
