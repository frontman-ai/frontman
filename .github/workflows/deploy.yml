name: Deploy Production

on:
  push:
    branches:
      - main
    paths:
      - 'apps/frontman_server/**'
      - 'apps/swarm_ai/**'
      - 'libs/**'
      - 'rescript.json'
      - 'mise.toml'
      - '.github/workflows/deploy.yml'
      - 'infra/**'
      - '!infra/production/notifier/**'
  workflow_dispatch:

# Only one deploy at a time — newer pushes cancel in-progress deploys
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ==========================================================================
  # Client build: validate and package on an ephemeral GitHub-hosted runner
  # ==========================================================================
  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.4.1'

      - name: Enable Corepack
        run: corepack enable && corepack install

      - name: Cache dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.yarn/berry/cache
          key: yarn-berry-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-berry-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build client standalone bundle
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: make -C libs/client build-standalone

      - name: Upload client bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-dist
          path: libs/client/dist
          if-no-files-found: error
          overwrite: true

      - name: Notify Discord on client build failure
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/discord-notify
        with:
          status: ${{ job.status }}
          component: Client build
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}

  # ==========================================================================
  # Server: rsync source → build natively on prod server → blue-green deploy
  # ==========================================================================
  deploy-server:
    name: Deploy Server
    needs: build-client
    runs-on: self-hosted
    environment: production
    env:
      PROD_SERVER: ${{ secrets.PROD_SERVER }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$PROD_SERVER" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync source to production server
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '_build' \
            --exclude 'deps' \
            --exclude '.worktrees' \
            --exclude '.DS_Store' \
            --exclude '.yarn' \
            --exclude '.env.local' \
            --exclude '.certs' \
            --exclude 'docs' \
            --exclude 'infra/marketing' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ \
            "deploy@${PROD_SERVER}:/opt/frontman/build/"

      - name: Copy deploy script
        run: |
          scp -i ~/.ssh/deploy_key \
            infra/production/build-and-deploy.sh \
            "deploy@${PROD_SERVER}:/opt/frontman/build-and-deploy.sh"
          ssh -i ~/.ssh/deploy_key "deploy@${PROD_SERVER}" \
            'chmod +x /opt/frontman/build-and-deploy.sh'

      - name: Update Sentry DSN in production environments
        run: |
          SENTRY_DSN_B64=$(printf '%s' "$SENTRY_DSN" | base64 | tr -d '\n')
          ssh -i ~/.ssh/deploy_key "deploy@${PROD_SERVER}" \
            "SENTRY_DSN_B64=${SENTRY_DSN_B64} bash -s" <<'EOF'
          sentry_dsn=$(printf '%s' "$SENTRY_DSN_B64" | base64 -d)
          for slot in blue green; do
            env_file="/opt/frontman/${slot}/env"
            grep -v '^SENTRY_DSN=' "$env_file" > "${env_file}.tmp"
            printf 'SENTRY_DSN=%s\n' "$sentry_dsn" >> "${env_file}.tmp"
            chmod --reference="$env_file" "${env_file}.tmp"
            mv "${env_file}.tmp" "$env_file"
          done
          EOF

      - name: Build and deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "deploy@${PROD_SERVER}" \
            '/opt/frontman/build-and-deploy.sh'

      - name: Sync monitoring configs and reload
        run: |
          ssh -i ~/.ssh/deploy_key "deploy@${PROD_SERVER}" bash -s <<'EOF'
          # Only sync if monitoring is installed (setup-monitoring.sh has been run)
          if [ -f /usr/local/bin/prometheus ]; then
            BUILD_MON="/opt/frontman/build/infra/production/monitoring"
            if [ -d "${BUILD_MON}" ]; then
              echo "Syncing monitoring configs..."
              sudo cp "${BUILD_MON}/prometheus.yml" /etc/prometheus/prometheus.yml
              sudo cp "${BUILD_MON}/alert-rules.yml" /etc/prometheus/alert-rules.yml
              sudo cp "${BUILD_MON}/blackbox.yml" /etc/prometheus/blackbox.yml
              sudo cp "${BUILD_MON}/alertmanager.yml" /etc/alertmanager/alertmanager.yml
              sudo chown -R prometheus:prometheus /etc/prometheus
              sudo chown -R alertmanager:alertmanager /etc/alertmanager

              echo "Reloading Prometheus..."
              curl -sf -X POST http://127.0.0.1:9090/-/reload || echo "  Warning: Prometheus reload failed"
              echo "Reloading Alertmanager..."
              curl -sf -X POST http://127.0.0.1:9093/-/reload || echo "  Warning: Alertmanager reload failed"
              echo "Monitoring configs synced and reloaded."
            fi
          else
            echo "Monitoring not installed — skipping config sync."
          fi
          EOF

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Notify Discord
        if: always()
        continue-on-error: true
        uses: ./.github/actions/discord-notify
        with:
          status: ${{ job.status }}
          component: Server
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}

  # ==========================================================================
  # Client deploy: publish validated bundle after server health check succeeds
  # ==========================================================================
  deploy-client:
    name: Deploy Client
    needs: deploy-server
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.4.1'

      - name: Enable Corepack
        run: corepack enable && corepack install

      - name: Download client bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: client-dist
          path: libs/client/dist

      - name: Deploy client to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: yarn
          command: pages deploy libs/client/dist --project-name=frontman-client --branch=main

      - name: Notify Discord
        if: always()
        continue-on-error: true
        uses: ./.github/actions/discord-notify
        with:
          status: ${{ job.status }}
          component: Client
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
