name: Deploy Production

on:
  push:
    branches:
      - main
    paths:
      - 'apps/frontman_server/**'
      - 'apps/swarm_ai/**'
      - 'libs/**'
      - 'rescript.json'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
      - '.yarn/**'
      - 'Makefile'
      - 'mise.toml'
      - '.github/actions/discord-notify/**'
      - '.github/workflows/deploy.yml'
      - 'scripts/ci/production-smoke.sh'
      - 'infra/**'
      - '!infra/production/notifier/**'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      server: ${{ steps.baseline.outputs.force == 'true' || steps.paths.outputs.server == 'true' }}
      client: ${{ steps.baseline.outputs.force == 'true' || steps.paths.outputs.client == 'true' }}
      monitoring: ${{ steps.baseline.outputs.force == 'true' || steps.paths.outputs.monitoring == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Find last successful main push deployment
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          force=true
          base=''
          if [[ "$EVENT" == push && "$REF" == refs/heads/main ]]; then
            if base=$(gh api "repos/$GH_REPO/actions/workflows/deploy.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty'); then
              if [[ -n "$base" && "$base" != "$(git rev-parse HEAD)" ]] && git merge-base --is-ancestor "$base" HEAD; then
                force=false
              fi
            else
              echo '::warning::Cannot read successful deployment baseline; deploying both apps and monitoring.'
            fi
          fi
          echo "force=$force" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: paths
        if: steps.baseline.outputs.force != 'true'
        with:
          base: ${{ steps.baseline.outputs.base }}
          ref: ${{ github.sha }}
          filters: |
            server:
              - 'apps/frontman_server/**'
              - 'apps/swarm_ai/**'
              - 'infra/production/*.sh'
              - 'infra/production/*.template'
              - 'infra/production/systemd/**'
              - 'scripts/ci/production-smoke.sh'
              - 'mise.toml'
              - 'Makefile'
              - '.github/workflows/deploy.yml'
              - '.github/actions/discord-notify/**'
            monitoring:
              - 'infra/production/monitoring/**'
              - '.github/workflows/deploy.yml'
            client:
              - 'libs/**'
              - 'rescript.json'
              - 'package.json'
              - 'yarn.lock'
              - '.yarnrc.yml'
              - '.yarn/**'
              - 'mise.toml'
              - 'Makefile'
              - '.github/workflows/deploy.yml'
              - '.github/actions/discord-notify/**'

  build-client:
    name: Build Client
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.4.1'

      - name: Enable Corepack
        run: corepack enable && corepack install

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry/cache
          key: yarn-berry-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-berry-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build client standalone bundle
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: make -C libs/client build-standalone

      - name: Upload client bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: client-dist
          path: libs/client/dist
          if-no-files-found: error
          overwrite: true

      - name: Notify Discord on client build failure
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/discord-notify
        with:
          status: ${{ job.status }}
          component: Client build
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}

  deploy-server:
    name: Deploy Server
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: self-hosted
    environment: production
    env:
      PROD_SERVER: ${{ secrets.PROD_SERVER }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$PROD_SERVER" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync source to production server
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '_build' \
            --exclude 'deps' \
            --exclude '.worktrees' \
            --exclude '.DS_Store' \
            --exclude '.yarn' \
            --exclude '.env.local' \
            --exclude '.certs' \
            --exclude 'docs' \
            --exclude 'infra/marketing' \
            --exclude '/infra/production/monitoring' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ \
            "deploy@${PROD_SERVER}:/opt/frontman/build/"

      - name: Copy deploy scripts
        run: |
          scp -i ~/.ssh/deploy_key \
            infra/production/build-and-deploy.sh \
            "deploy@${PROD_SERVER}:/opt/frontman/build-and-deploy.sh"
          scp -i ~/.ssh/deploy_key \
            infra/production/deploy.sh \
            infra/production/rollback.sh \
            "deploy@${PROD_SERVER}:/opt/frontman/"
          ssh -i ~/.ssh/deploy_key "deploy@${PROD_SERVER}" \
            'chmod +x /opt/frontman/build-and-deploy.sh /opt/frontman/deploy.sh /opt/frontman/rollback.sh'

      - name: Build and deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "deploy@${PROD_SERVER}" \
            '/opt/frontman/build-and-deploy.sh'

      - name: Smoke test production OAuth start routes
        run: scripts/ci/production-smoke.sh

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Notify Discord
        if: always()
        continue-on-error: true
        uses: ./.github/actions/discord-notify
        with:
          status: ${{ job.status }}
          component: Server
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}

  deploy-monitoring:
    name: Deploy Monitoring Configs
    needs: changes
    if: needs.changes.outputs.monitoring == 'true'
    runs-on: self-hosted
    environment: production
    env:
      PROD_SERVER: ${{ secrets.PROD_SERVER }}
      MONITORING_STAGE: /opt/frontman/build/infra/production/monitoring
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/monitoring_deploy_key
          chmod 600 ~/.ssh/monitoring_deploy_key
          ssh-keyscan -H "$PROD_SERVER" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload current monitoring configs
        run: |
          ssh -i ~/.ssh/monitoring_deploy_key "deploy@${PROD_SERVER}" "mkdir -p '$MONITORING_STAGE'"
          rsync -az --delete -e "ssh -i ~/.ssh/monitoring_deploy_key" \
            infra/production/monitoring/ "deploy@${PROD_SERVER}:${MONITORING_STAGE}/"

      - name: Sync monitoring configs and reload
        run: |
          ssh -i ~/.ssh/monitoring_deploy_key "deploy@${PROD_SERVER}" bash -s -- "$MONITORING_STAGE" <<'EOF'
          set -euo pipefail
          if [ -f /usr/local/bin/prometheus ]; then
            BUILD_MON="$1"
            echo "Syncing monitoring configs..."
            sudo cp "${BUILD_MON}/prometheus.yml" /etc/prometheus/prometheus.yml
            sudo cp "${BUILD_MON}/alert-rules.yml" /etc/prometheus/alert-rules.yml
            sudo cp "${BUILD_MON}/blackbox.yml" /etc/prometheus/blackbox.yml
            sudo cp "${BUILD_MON}/alertmanager.yml" /etc/alertmanager/alertmanager.yml
            sudo chown -R prometheus:prometheus /etc/prometheus
            sudo chown -R alertmanager:alertmanager /etc/alertmanager

            echo "Reloading Prometheus..."
            curl -sf -X POST http://127.0.0.1:9090/-/reload
            echo "Reloading Alertmanager..."
            curl -sf -X POST http://127.0.0.1:9093/-/reload
            echo "Monitoring configs synced and reloaded."
          else
            echo "Monitoring not installed — skipping config sync."
          fi
          EOF

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/monitoring_deploy_key

      - name: Notify Discord
        if: always()
        continue-on-error: true
        uses: ./.github/actions/discord-notify
        with:
          status: ${{ job.status }}
          component: Monitoring
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}

  deploy-client:
    name: Deploy Client
    needs: [changes, build-client, deploy-server]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' &&
          needs.changes.outputs.client == 'true' && needs.build-client.result == 'success' &&
          (needs.deploy-server.result == 'success' ||
           (needs.changes.outputs.server == 'false' && needs.deploy-server.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.4.1'

      - name: Enable Corepack
        run: corepack enable && corepack install

      - name: Download client bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: client-dist
          path: libs/client/dist

      - name: Deploy client to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: yarn
          command: pages deploy libs/client/dist --project-name=frontman-client --branch=main

      - name: Notify Discord
        if: always()
        continue-on-error: true
        uses: ./.github/actions/discord-notify
        with:
          status: ${{ job.status }}
          component: Client
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
