name: Deploy Production

on:
  push:
    branches:
      - main
    paths:
      - 'apps/frontman_server/**'
      - 'apps/swarm_ai/**'
      - 'libs/**'
      - 'rescript.json'
      - 'mise.toml'
      - '.github/workflows/deploy.yml'
      - 'scripts/ci/production-smoke.sh'
      - 'infra/**'
      - '!infra/production/notifier/**'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.4.1'

      - name: Enable Corepack
        run: corepack enable && corepack install

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry/cache
          key: yarn-berry-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-berry-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build client standalone bundle
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: make -C libs/client build-standalone

      - name: Upload client bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: client-dist
          path: libs/client/dist
          if-no-files-found: error
          overwrite: true

      - name: Notify Discord on client build failure
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/discord-notify
        with:
          status: ${{ job.status }}
          component: Client build
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}

  deploy-server:
    name: Deploy Server
    needs: build-client
    runs-on: self-hosted
    environment: production
    env:
      PROD_SERVER: ${{ secrets.PROD_SERVER }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$PROD_SERVER" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync source to production server
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '_build' \
            --exclude 'deps' \
            --exclude '.worktrees' \
            --exclude '.DS_Store' \
            --exclude '.yarn' \
            --exclude '.env.local' \
            --exclude '.certs' \
            --exclude 'docs' \
            --exclude 'infra/marketing' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ \
            "deploy@${PROD_SERVER}:/opt/frontman/build/"

      - name: Copy deploy script
        run: |
          scp -i ~/.ssh/deploy_key \
            infra/production/build-and-deploy.sh \
            "deploy@${PROD_SERVER}:/opt/frontman/build-and-deploy.sh"
          ssh -i ~/.ssh/deploy_key "deploy@${PROD_SERVER}" \
            'chmod +x /opt/frontman/build-and-deploy.sh'

      - name: Build and deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "deploy@${PROD_SERVER}" \
            '/opt/frontman/build-and-deploy.sh'

      - name: Sync monitoring configs and reload
        run: |
          ssh -i ~/.ssh/deploy_key "deploy@${PROD_SERVER}" bash -s <<'EOF'
          if [ -f /usr/local/bin/prometheus ]; then
            BUILD_MON="/opt/frontman/build/infra/production/monitoring"
            if [ -d "${BUILD_MON}" ]; then
              echo "Syncing monitoring configs..."
              sudo cp "${BUILD_MON}/prometheus.yml" /etc/prometheus/prometheus.yml
              sudo cp "${BUILD_MON}/alert-rules.yml" /etc/prometheus/alert-rules.yml
              sudo cp "${BUILD_MON}/blackbox.yml" /etc/prometheus/blackbox.yml
              sudo cp "${BUILD_MON}/alertmanager.yml" /etc/alertmanager/alertmanager.yml
              sudo chown -R prometheus:prometheus /etc/prometheus
              sudo chown -R alertmanager:alertmanager /etc/alertmanager

              echo "Reloading Prometheus..."
              curl -sf -X POST http://127.0.0.1:9090/-/reload || echo "  Warning: Prometheus reload failed"
              echo "Reloading Alertmanager..."
              curl -sf -X POST http://127.0.0.1:9093/-/reload || echo "  Warning: Alertmanager reload failed"
              echo "Monitoring configs synced and reloaded."
            fi
          else
            echo "Monitoring not installed — skipping config sync."
          fi
          EOF

      - name: Smoke test production OAuth start routes
        run: scripts/ci/production-smoke.sh

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Notify Discord
        if: always()
        continue-on-error: true
        uses: ./.github/actions/discord-notify
        with:
          status: ${{ job.status }}
          component: Server
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}

  deploy-client:
    name: Deploy Client
    needs: deploy-server
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.4.1'

      - name: Enable Corepack
        run: corepack enable && corepack install

      - name: Download client bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: client-dist
          path: libs/client/dist

      - name: Deploy client to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: yarn
          command: pages deploy libs/client/dist --project-name=frontman-client --branch=main

      - name: Notify Discord
        if: always()
        continue-on-error: true
        uses: ./.github/actions/discord-notify
        with:
          status: ${{ job.status }}
          component: Client
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
