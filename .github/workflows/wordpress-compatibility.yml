name: WordPress Compatibility

on:
  pull_request:
    paths:
      - "libs/frontman-wordpress/**"
      - "scripts/test-wordpress-plugin-runtime.sh"
      - "scripts/package-wordpress-plugin.sh"
      - "scripts/validate-wordpress-plugin-release.sh"
      - ".github/workflows/wordpress-compatibility.yml"
      - "Makefile"
  push:
    branches:
      - main
    paths:
      - "libs/frontman-wordpress/**"
      - "scripts/test-wordpress-plugin-runtime.sh"
      - "scripts/package-wordpress-plugin.sh"
      - "scripts/validate-wordpress-plugin-release.sh"
      - ".github/workflows/wordpress-compatibility.yml"
      - "Makefile"

permissions:
  contents: read

jobs:
  wordpress-runtime:
    name: WordPress ${{ matrix.wordpress }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: "6.0.9"
            php: "7.4"
          - wordpress: "7.0.2"
            php: "7.4"
          - wordpress: "7.0.2"
            php: "8.4"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.4.1'

      - name: Enable Corepack
        run: corepack enable && corepack install

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry/cache
          key: yarn-berry-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-berry-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run isolated PHP tests
        run: |
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -w /workspace \
            "php:${{ matrix.php }}-cli" \
            sh -c 'for test in libs/frontman-wordpress/tests/*Test.php; do php -d auto_prepend_file=libs/frontman-wordpress/tests/ErrorHandler.php "$test" || exit 1; done'

      - name: Run WordPress runtime tests
        env:
          WORDPRESS_VERSION: ${{ matrix.wordpress }}
          PHP_VERSION: ${{ matrix.php }}
        run: bash scripts/test-wordpress-plugin-runtime.sh
