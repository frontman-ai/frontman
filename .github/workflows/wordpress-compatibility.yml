name: WordPress Compatibility

on:
  pull_request:
    paths:
      - "libs/frontman-preview-bridge/**"
      - "libs/frontman-protocol/**"
      - "libs/frontman-astro-browser/**"
      - "libs/client/**"
      - "libs/frontman-wordpress/**"
      - "apps/frontman_server/**"
      - "apps/swarm_ai/**"
      - "scripts/build-wordpress-dependencies.sh"
      - "scripts/wordpress-*.php"
      - "scripts/test-wordpress-plugin-runtime.sh"
      - "scripts/package-wordpress-plugin.sh"
      - "scripts/validate-wordpress-plugin-release.sh"
      - ".github/workflows/wordpress-compatibility.yml"
      - "Makefile"
      - "package.json"
      - ".yarnrc.yml"
      - "yarn.lock"
  push:
    branches:
      - main
    paths:
      - "libs/frontman-preview-bridge/**"
      - "libs/frontman-protocol/**"
      - "libs/frontman-astro-browser/**"
      - "libs/client/**"
      - "libs/frontman-wordpress/**"
      - "apps/frontman_server/**"
      - "apps/swarm_ai/**"
      - "scripts/build-wordpress-dependencies.sh"
      - "scripts/wordpress-*.php"
      - "scripts/test-wordpress-plugin-runtime.sh"
      - "scripts/package-wordpress-plugin.sh"
      - "scripts/validate-wordpress-plugin-release.sh"
      - ".github/workflows/wordpress-compatibility.yml"
      - "Makefile"
      - "package.json"
      - ".yarnrc.yml"
      - "yarn.lock"

permissions:
  contents: read

env:
  FRONTMAN_WP_PLUGIN_DIR: dist/frontman-wordpress-package/github/frontman-agentic-ai-editor

jobs:
  package:
    name: Build WordPress runtime plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.4.1'
      - name: Install plugin build dependencies
        run: corepack enable && corepack install && yarn workspaces focus @frontman-ai/frontman-preview-bridge
      - run: |
          make package-wordpress-plugin
          tar -czf wordpress-runtime.tar.gz "$FRONTMAN_WP_PLUGIN_DIR" dist/wordpress-dependencies-source/vendor
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wordpress-runtime
          path: wordpress-runtime.tar.gz
          if-no-files-found: error

  wordpress-runtime:
    needs: package
    name: WordPress ${{ matrix.wordpress }} / PHP ${{ matrix.php }} / Yoast ${{ matrix.yoast }} / WooCommerce ${{ matrix.woocommerce || 'auto' }}
    runs-on: ubuntu-latest
    env:
      FRONTMAN_REQUIRE_WP_SDK: ${{ matrix.wordpress == '7.0.2' && matrix.php == '8.4' && !matrix.yoast && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: "6.0.9"
            php: "7.4"
          - wordpress: "7.0.2"
            php: "7.4"
          - wordpress: "7.0.2"
            php: "8.4"
          - wordpress: "7.0.2"
            php: "8.4"
            woocommerce: "11.2.2"
          - wordpress: "7.0.2"
            php: "7.4"
            yoast: "28.4"
          - wordpress: "7.0.2"
            php: "8.4"
            yoast: "28.4"
          - wordpress: "7.0.2"
            php: "8.4"
            yoast: "28.6"
          - wordpress: "6.9.9"
            php: "8.2"
            yoast: "19.9"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: wordpress-runtime
      - run: tar -xzf wordpress-runtime.tar.gz

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: env.FRONTMAN_REQUIRE_WP_SDK == '1'
        with:
          node-version: '24.4.1'

      - name: Install SDK browser test dependencies
        if: env.FRONTMAN_REQUIRE_WP_SDK == '1'
        run: corepack enable && corepack install && yarn workspaces focus @frontman-ai/client @frontman-ai/frontman-preview-bridge

      - name: Set up SDK integration toolchain
        if: env.FRONTMAN_REQUIRE_WP_SDK == '1'
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e
        with:
          install: true
          cache: true

      - name: Cache SDK test dependencies
        if: env.FRONTMAN_REQUIRE_WP_SDK == '1'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            apps/frontman_server/deps
            apps/frontman_server/_build/test/lib/*
            !apps/frontman_server/_build/test/lib/frontman_server
            !apps/frontman_server/_build/test/lib/swarm_ai
            !apps/frontman_server/_build/test/lib/frontman_notifier
          key: wp-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'apps/frontman_server/mix.exs', 'apps/frontman_server/mix.lock', 'apps/frontman_server/config/**', 'apps/swarm_ai/mix.exs', 'apps/frontman_notifier/mix.exs') }}

      - name: Prepare SDK integration dependencies
        if: env.FRONTMAN_REQUIRE_WP_SDK == '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          docker run -d --rm --name wp-sdk-postgres -p 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD=postgres postgres:16
          timeout 60 bash -c 'until pg_isready -q -h 127.0.0.1; do sleep 1; done'
          make setup-elixir-tools
          make -C libs/frontman-preview-bridge install-browser
          cd apps/frontman_server && mix deps.get

      - name: Run WordPress runtime tests
        env:
          WORDPRESS_VERSION: ${{ matrix.wordpress }}
          PHP_VERSION: ${{ matrix.php }}
          YOAST_VERSION: ${{ matrix.yoast }}
          WOOCOMMERCE_OVERRIDE: ${{ matrix.woocommerce }}
          FRONTMAN_WP_DIAGNOSTICS: "1"
        run: make test-wordpress-runtime

      - name: Run isolated PHP tests
        run: |
          cp -a "$FRONTMAN_WP_PLUGIN_DIR/." libs/frontman-wordpress/
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -w /workspace \
            "php:${{ matrix.php }}-cli" \
            sh -ec 'for test in libs/frontman-wordpress/tests/*Test.php; do php -d auto_prepend_file=libs/frontman-wordpress/tests/ErrorHandler.php "$test"; done; php -d auto_prepend_file=libs/frontman-wordpress/tests/ErrorHandler.php libs/frontman-wordpress/tests/SentryTest.php --site-first'
