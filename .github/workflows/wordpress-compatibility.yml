name: WordPress Compatibility

on:
  pull_request:
    paths:
      - "libs/frontman-preview-bridge/**"
      - "libs/frontman-protocol/**"
      - "libs/frontman-astro-browser/**"
      - "libs/client/**"
      - "libs/frontman-wordpress/**"
      - "apps/frontman_server/**"
      - "apps/swarm_ai/**"
      - "scripts/build-wordpress-dependencies.sh"
      - "scripts/wordpress-*.php"
      - "scripts/test-wordpress-plugin-runtime.sh"
      - "scripts/package-wordpress-plugin.sh"
      - "scripts/validate-wordpress-plugin-release.sh"
      - ".github/workflows/wordpress-compatibility.yml"
      - "Makefile"
      - "package.json"
      - ".yarnrc.yml"
      - "yarn.lock"
  push:
    branches:
      - main
    paths:
      - "libs/frontman-preview-bridge/**"
      - "libs/frontman-protocol/**"
      - "libs/frontman-astro-browser/**"
      - "libs/client/**"
      - "libs/frontman-wordpress/**"
      - "apps/frontman_server/**"
      - "apps/swarm_ai/**"
      - "scripts/build-wordpress-dependencies.sh"
      - "scripts/wordpress-*.php"
      - "scripts/test-wordpress-plugin-runtime.sh"
      - "scripts/package-wordpress-plugin.sh"
      - "scripts/validate-wordpress-plugin-release.sh"
      - ".github/workflows/wordpress-compatibility.yml"
      - "Makefile"
      - "package.json"
      - ".yarnrc.yml"
      - "yarn.lock"

permissions:
  contents: read

jobs:
  wordpress-runtime:
    name: WordPress ${{ matrix.wordpress }} / PHP ${{ matrix.php }} / Yoast ${{ matrix.yoast }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: "6.0.9"
            php: "7.4"
          - wordpress: "7.0.2"
            php: "7.4"
          - wordpress: "7.0.2"
            php: "8.4"
          - wordpress: "7.0.2"
            php: "7.4"
            yoast: "28.4"
          - wordpress: "7.0.2"
            php: "8.4"
            yoast: "28.4"
          - wordpress: "7.0.2"
            php: "8.4"
            yoast: "28.6"
          - wordpress: "6.9.9"
            php: "8.2"
            yoast: "19.9"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.4.1'

      - name: Install bridge build dependencies
        run: corepack enable && corepack install && yarn install --immutable

      - name: Set up SDK integration toolchain
        if: matrix.wordpress == '7.0.2' && matrix.php == '8.4' && !matrix.yoast
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492
        with:
          install: true
          cache: true

      - name: Prepare SDK integration dependencies
        if: matrix.wordpress == '7.0.2' && matrix.php == '8.4' && !matrix.yoast
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          docker run -d --rm --name wp-sdk-postgres -p 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD=postgres postgres:16
          timeout 60 bash -c 'until pg_isready -q -h 127.0.0.1; do sleep 1; done'
          make setup-elixir-tools
          make -C libs/frontman-preview-bridge install-browser
          cd apps/frontman_server && mix deps.get

      - name: Package plugin and run WordPress runtime tests
        env:
          WORDPRESS_VERSION: ${{ matrix.wordpress }}
          PHP_VERSION: ${{ matrix.php }}
          YOAST_VERSION: ${{ matrix.yoast }}
          FRONTMAN_REQUIRE_WP_SDK: ${{ matrix.wordpress == '7.0.2' && matrix.php == '8.4' && !matrix.yoast && '1' || '0' }}
        run: make test-wordpress-runtime

      - name: Run isolated PHP tests
        run: |
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -w /workspace \
            "php:${{ matrix.php }}-cli" \
            sh -ec 'for test in libs/frontman-wordpress/tests/*Test.php; do php -d auto_prepend_file=libs/frontman-wordpress/tests/ErrorHandler.php "$test"; done; php -d auto_prepend_file=libs/frontman-wordpress/tests/ErrorHandler.php libs/frontman-wordpress/tests/SentryTest.php --site-first'
