name: WordPress Compatibility

on:
  pull_request:
    paths:
      - "libs/frontman-preview-bridge/**"
      - "libs/frontman-protocol/**"
      - "libs/frontman-astro-browser/**"
      - "libs/frontman-wordpress/**"
      - "scripts/build-wordpress-dependencies.sh"
      - "scripts/test-wordpress-isolated.sh"
      - "scripts/wordpress-*.php"
      - "scripts/test-wordpress-plugin-runtime.sh"
      - "scripts/test-wordpress-301-runtime.sh"
      - "scripts/package-wordpress-plugin.sh"
      - "scripts/validate-wordpress-plugin-release.sh"
      - ".github/workflows/wordpress-compatibility.yml"
      - "Makefile"
      - "package.json"
      - ".yarnrc.yml"
      - "yarn.lock"
  push:
    branches:
      - main
    paths:
      - "libs/frontman-preview-bridge/**"
      - "libs/frontman-protocol/**"
      - "libs/frontman-astro-browser/**"
      - "libs/frontman-wordpress/**"
      - "scripts/build-wordpress-dependencies.sh"
      - "scripts/test-wordpress-isolated.sh"
      - "scripts/wordpress-*.php"
      - "scripts/test-wordpress-plugin-runtime.sh"
      - "scripts/test-wordpress-301-runtime.sh"
      - "scripts/package-wordpress-plugin.sh"
      - "scripts/validate-wordpress-plugin-release.sh"
      - ".github/workflows/wordpress-compatibility.yml"
      - "Makefile"
      - "package.json"
      - ".yarnrc.yml"
      - "yarn.lock"

permissions:
  contents: read

jobs:
  wordpress-runtime:
    name: WordPress ${{ matrix.wordpress }} / PHP ${{ matrix.php }} / Yoast ${{ matrix.yoast }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: "6.0.9"
            php: "7.4"
          - wordpress: "7.0.2"
            php: "7.4"
          - wordpress: "7.0.2"
            php: "8.4"
          - wordpress: "7.0.2"
            php: "7.4"
            yoast: "28.4"
          - wordpress: "7.0.2"
            php: "8.4"
            yoast: "28.4"
          - wordpress: "7.0.2"
            php: "8.4"
            yoast: "28.6"
          - wordpress: "6.9.9"
            php: "8.2"
            yoast: "19.9"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.4.1'

      - name: Install bridge build dependencies
        run: corepack enable && corepack install && yarn install --immutable

      - name: Package plugin and run WordPress runtime tests
        env:
          WORDPRESS_VERSION: ${{ matrix.wordpress }}
          PHP_VERSION: ${{ matrix.php }}
          YOAST_VERSION: ${{ matrix.yoast }}
        run: make test-wordpress-runtime

      - name: Run focused redirect coexistence tests
        if: matrix.wordpress == '7.0.2' && matrix.php == '8.4' && !matrix.yoast
        env:
          WORDPRESS_VERSION: ${{ matrix.wordpress }}
          PHP_VERSION: ${{ matrix.php }}
        run: make test-wordpress-301-runtime

      - name: Run isolated PHP tests
        env:
          WORDPRESS_VERSION: ${{ matrix.wordpress }}
        run: |
          bash scripts/test-wordpress-isolated.sh sh -ec '
            docker run --rm \
              -v "$PWD:/workspace:ro" \
              -v "$FRONTMAN_WORDPRESS_SOURCE:/wordpress:ro" \
              -e FRONTMAN_WORDPRESS_SOURCE=/wordpress \
              -w /workspace \
              "php:${{ matrix.php }}-cli" \
              sh -ec '"'"'for test in libs/frontman-wordpress/tests/*Test.php; do php -d auto_prepend_file=libs/frontman-wordpress/tests/ErrorHandler.php "$test"; done; php -d auto_prepend_file=libs/frontman-wordpress/tests/ErrorHandler.php libs/frontman-wordpress/tests/SentryTest.php --site-first'"'"'
          '
