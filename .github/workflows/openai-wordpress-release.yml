name: OpenAI WordPress Release

on:
  pull_request:
    paths:
      - 'plugins/openai-wordpress/**'
      - 'apps/marketing/public/favicon.svg'
      - 'package.json'
      - 'yarn.lock'
      - 'Makefile'
      - 'scripts/*openai-wordpress*'
      - '.github/workflows/release-pr.yml'
      - '.github/workflows/release-tag.yml'
      - '.github/workflows/openai-wordpress-release.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: openai-wordpress-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.4.1'
      - run: corepack enable && corepack install && yarn install --immutable
      - run: make -C plugins/openai-wordpress check test NODE=node
